{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="rw-auth-wrapper py-5">
  <div class="container d-flex justify-content-center">
    <div class="rw-auth-card" style="max-width:440px;width:100%;">
      <div class="rw-auth-header">
        <span class="rw-auth-logo"><i class="bi bi-key-fill me-1"></i>Reset Password</span>
        <p class="rw-auth-tagline mb-0">Enter your email address to receive a reset link</p>
      </div>
      <div class="rw-auth-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-4">
            <label for="id_email">Email Address</label>
            <div class="input-group">
              <span class="input-group-text"
                    style="background:var(--rw-bg-input);border:1px solid var(--rw-border);border-right:none;border-radius:10px 0 0 10px;color:var(--rw-text-muted);">
                <i class="bi bi-envelope"></i>
              </span>
              <input type="email" name="email" id="id_email"
                     class="form-control rw-input" placeholder="your@email.com" required
                     style="border-left:none!important;border-radius:0 10px 10px 0!important;">
            </div>
            <div style="font-size:0.8rem;color:var(--rw-text-muted);margin-top:0.4rem;">
              We'll send a reset link to this address if it's registered.
            </div>
          </div>
          <button type="submit" class="btn btn-rw-primary w-100 py-3">
            <i class="bi bi-send me-2"></i>Send Reset Link
          </button>
        </form>
      </div>
      <div class="rw-auth-footer">
        Remember your password?
        <a href="{% url 'login' %}" class="ms-1" style="font-weight:600;">Sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
