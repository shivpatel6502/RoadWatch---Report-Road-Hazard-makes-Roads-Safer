{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="rw-auth-wrapper py-5">
  <div class="container d-flex justify-content-center">
    <div class="rw-auth-card text-center" style="max-width:440px;width:100%;">
      <div class="rw-auth-header">
        <span style="font-size:2.5rem;display:block;margin-bottom:0.5rem;">✅</span>
        <span class="rw-auth-logo">Password Reset!</span>
        <p class="rw-auth-tagline mb-0">Your password has been changed successfully</p>
      </div>
      <div class="rw-auth-body">
        <p style="color:var(--rw-text-dim);font-size:0.9rem;">
          You can now sign in with your new password.
        </p>
        <a href="{% url 'login' %}" class="btn btn-rw-primary w-100 py-3">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In Now
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
